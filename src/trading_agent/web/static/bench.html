<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Model Bench</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e;
    --accent:#1f6feb; --ok:#2ea043; --bad:#f85149; --warn:#d29922;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--border);
    padding:12px 16px; z-index:10; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .spread { justify-content:space-between; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .status { font-size:12px; color:var(--muted); }
  .dot { color:var(--bad); } .dot.on { color:var(--ok); }
  main { padding:14px 16px 48px; max-width:900px; margin:0 auto; }
  .controls { background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:12px; margin-bottom:18px; }
  label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;
    display:block; margin-bottom:3px; }
  select, button, input { font:inherit; border-radius:6px; border:1px solid var(--border);
    background:#0d1117; color:var(--text); padding:8px 10px; }
  select { min-width:0; max-width:100%; }
  .field { flex:1 1 200px; min-width:0; }
  button { cursor:pointer; font-weight:600; border:none; }
  button.primary { background:var(--accent); color:#fff; }
  button.go { background:var(--ok); color:#fff; }
  button.stop { background:var(--bad); color:#fff; }
  button.ghost { background:#21262d; color:var(--text); }
  button.x { background:transparent; color:var(--muted); border:1px solid var(--border); padding:4px 8px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--border);
    font-variant-numeric:tabular-nums; }
  th { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  td.num { text-align:right; }
  .pos { color:var(--ok); } .neg { color:var(--bad); }
  .rank { color:var(--muted); width:24px; }
  .model { font-weight:600; }
  .comment { color:var(--muted); font-size:12px; }
  .err { color:var(--warn); font-size:12px; }
  .sec-title { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
    margin:22px 0 8px; }
  .feed div { padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .badge { font-size:11px; padding:1px 6px; border-radius:8px; background:var(--border); }
  .badge.filled { background:#193c25; color:var(--ok); }
  .badge.blocked, .badge.rejected { background:#3a2d12; color:var(--warn); }
  .badge.error { background:#3a1518; color:var(--bad); }
  .empty { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<header>
  <div class="row spread">
    <h1>⚔️ Model Bench</h1>
    <span class="status" id="status"><span class="dot" id="dot">●</span> …</span>
  </div>
</header>
<main>
  <div class="controls">
    <div class="row">
      <div class="field">
        <label for="model">Add a model</label>
        <select id="model"></select>
      </div>
      <div>
        <label>&nbsp;</label>
        <button class="primary" onclick="addModel()">+ Add</button>
      </div>
      <div class="field">
        <label for="cadence">Decision cadence</label>
        <select id="cadence" onchange="setCadence()"></select>
      </div>
    </div>
    <div class="row" style="margin-top:12px;">
      <button class="go" id="startBtn" onclick="ctl('start')">▶ Start</button>
      <button class="stop" id="stopBtn" onclick="ctl('stop')">⏸ Stop</button>
      <button class="ghost" onclick="ctl('tick')">⟳ Run one round now</button>
    </div>
  </div>

  <div class="sec-title">Leaderboard</div>
  <table>
    <thead><tr>
      <th class="rank">#</th><th>Model</th><th class="num">Value</th>
      <th class="num">P&amp;L</th><th class="num">Ret%</th><th class="num">Trades</th><th></th>
    </tr></thead>
    <tbody id="board"></tbody>
  </table>

  <div class="sec-title">Recent decisions</div>
  <div class="feed" id="feed"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let modelsLoaded = false, cadenceLoaded = false;

function money(v){ return (v==null?0:v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function cls(v){ return v>=0?"pos":"neg"; }
function sign(v){ return v>=0?"+":""; }
function fmtTime(iso){ if(!iso) return ""; const d=new Date(iso.includes("Z")||iso.includes("+")?iso:iso+"Z");
  return isNaN(d)?iso:d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}); }
function price(p){ return p==null?"":("$"+Number(p).toPrecision(3)); }

async function loadModels(){
  const d = await (await fetch("/api/bench/models")).json();
  const sel = $("model"); sel.innerHTML = "";
  if (d.error){ sel.innerHTML = `<option>menu error: ${d.error}</option>`; return; }
  const grp = (label, items) => {
    if(!items.length) return;
    const og = document.createElement("optgroup"); og.label = label;
    items.forEach(m => {
      const o = document.createElement("option"); o.value = m.id;
      const pp = m.prompt_price ? ` (${price(m.prompt_price)}/tok in)` : "";
      o.textContent = m.name + pp;
      og.appendChild(o);
    });
    sel.appendChild(og);
  };
  grp("★ Featured", d.featured || []);
  grp("All models", d.all || []);
  modelsLoaded = true;
}

function loadCadence(status){
  if (cadenceLoaded) return;
  const sel = $("cadence"); sel.innerHTML = "";
  (status.cadence_options||[]).forEach(o => {
    const opt = document.createElement("option");
    opt.value = o.seconds; opt.textContent = o.label;
    if (o.seconds === status.cadence_seconds) opt.selected = true;
    sel.appendChild(opt);
  });
  cadenceLoaded = true;
}

async function addModel(){
  const model = $("model").value;
  if(!model) return;
  const r = await fetch("/api/bench/competitors", {method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify({model})});
  if(!r.ok){ const e=await r.json().catch(()=>({})); alert("add failed: "+(e.detail||r.status)); }
  refresh();
}
async function removeModel(name){
  await fetch("/api/bench/competitors/"+encodeURIComponent(name), {method:"DELETE"});
  refresh();
}
async function setCadence(){
  await fetch("/api/bench/cadence", {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({seconds: parseInt($("cadence").value,10)})});
}
async function ctl(action){
  await fetch("/api/bench/"+action, {method:"POST"});
  refresh();
}

function renderBoard(rows){
  const tb = $("board"); tb.innerHTML = "";
  if(!rows.length){ tb.innerHTML = `<tr><td colspan="7" class="empty">No models yet — add one above.</td></tr>`; return; }
  rows.forEach(r => {
    const tr = document.createElement("tr");
    const note = r.error ? `<div class="err">⚠ ${r.error}</div>`
                         : (r.last_comment ? `<div class="comment">${r.last_comment}</div>` : "");
    tr.innerHTML = `
      <td class="rank">${r.rank}</td>
      <td><span class="model">${r.name}</span>${note}</td>
      <td class="num">${money(r.account_value)}</td>
      <td class="num ${cls(r.pnl)}">${sign(r.pnl)}${money(r.pnl)}</td>
      <td class="num ${cls(r.return_pct)}">${sign(r.return_pct)}${r.return_pct.toFixed(2)}</td>
      <td class="num">${r.trades}</td>
      <td class="num"><button class="x" onclick="removeModel('${r.name.replace(/'/g,"\\'")}')">✕</button></td>`;
    tb.appendChild(tr);
  });
}

function renderFeed(items){
  const el = $("feed"); el.innerHTML = "";
  if(!items.length){ el.innerHTML = `<div class="empty">No decisions yet.</div>`; return; }
  items.forEach(d => {
    const div = document.createElement("div");
    div.innerHTML = `<span class="badge ${d.status}">${d.status}</span> `
      + `<b>${d.competitor}</b> · ${d.action} ${d.quantity||""} ${d.symbol} `
      + `<span class="comment">${d.reason||d.detail||""}</span> `
      + `<span class="comment">${fmtTime(d.timestamp)}</span>`;
    el.appendChild(div);
  });
}

async function refresh(){
  if(!modelsLoaded) await loadModels();
  try{
    const d = await (await fetch("/api/bench", {cache:"no-store"})).json();
    const st = d.status || {};
    loadCadence(st);
    const running = st.running;
    $("dot").className = "dot" + (running?" on":"");
    $("status").innerHTML = `<span class="dot${running?" on":""}">●</span> `
      + `${running?"running":"stopped"} · ${st.cadence_seconds}s · `
      + `${(st.competitors||[]).length} models · ${fmtTime(d.generated_at)}`;
    renderBoard(d.leaderboard||[]);
    renderFeed(d.recent_decisions||[]);
  }catch(e){
    $("status").innerHTML = `<span class="dot">●</span> offline`;
  }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
