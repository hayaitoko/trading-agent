<aside id="chat-sidebar"
       class="w-96 shrink-0 border-r border-ink-100 surface-recess flex flex-col transition-[width] duration-200">
  <div class="flex items-center border-b border-ink-100 bg-paper-recess">
    <button id="chat-collapse"
            type="button"
            class="text-ink-60 hover:text-vermillion px-3 py-2 text-base leading-none display-text"
            title="Collapse sidebar"
            aria-label="Toggle sidebar">
      <span id="chat-collapse-icon">«</span>
    </button>
    <span id="chat-sidebar-label" class="small-caps text-ink-60">marginalia</span>
  </div>

  <div id="chat-body" class="flex-1 flex flex-col min-h-0">
    <header class="px-4 py-2 border-b border-ink-100/20 flex items-center gap-2">
      <select id="chat-model"
              class="flex-1 mono text-[0.72rem] text-ink-80 border-b border-ink-20 focus:border-vermillion py-1 cursor-pointer">
        <option>loading...</option>
      </select>
      <button id="chat-reset"
              type="button"
              title="Clear conversation"
              class="small-caps text-ink-60 hover:text-vermillion">
        reset
      </button>
    </header>

    <div id="chat-messages" class="flex-1 overflow-y-auto px-4 py-4 space-y-5 text-[0.92rem] leading-relaxed"></div>

    <div id="chat-attachments" class="px-4 pb-1 flex flex-wrap gap-1"></div>

    <div class="px-4 py-3 border-t border-ink-100/20 bg-paper-recess">
      <div id="chat-context-bar" class="micro-caps text-ink-60 mb-2 flex justify-between">
        <span>
          <span id="chat-tokens" class="mono">0</span> tokens · <span id="chat-context-pct">0</span>%
        </span>
        <span id="chat-model-limit" class="mono text-ink-40 lowercase tracking-normal">—</span>
      </div>
      <form id="chat-form" class="space-y-2">
        <textarea id="chat-input"
                  rows="3"
                  placeholder="Ask about an account, position, trade. Paste a screenshot if helpful."
                  class="w-full bg-paper-elevated border border-ink-20 px-3 py-2 text-[0.92rem] resize-none focus:border-vermillion"></textarea>
        <div class="flex items-center gap-3">
          <label class="small-caps text-ink-60 hover:text-vermillion cursor-pointer">
            <input id="chat-file" type="file" accept="image/*" multiple class="hidden">
            attach
          </label>
          <button id="chat-send"
                  type="submit"
                  class="btn-solid ml-auto">
            send →
          </button>
        </div>
      </form>
      <p id="chat-error" class="text-xs text-loss mt-2 hidden italic"></p>
    </div>
  </div>
</aside>
