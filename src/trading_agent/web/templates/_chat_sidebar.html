<aside id="chat-sidebar" class="w-96 border-r border-slate-800 bg-slate-900/40 flex flex-col">
  <header class="px-4 py-2 border-b border-slate-800 flex items-center gap-2 bg-slate-900/80">
    <select id="chat-model"
            class="flex-1 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs mono focus:border-emerald-500 focus:outline-none">
      <option>loading...</option>
    </select>
    <button id="chat-reset"
            title="Clear conversation"
            class="text-xs text-slate-400 hover:text-rose-400 px-2 py-1 border border-slate-700 rounded">
      reset
    </button>
  </header>

  <div id="chat-messages" class="flex-1 overflow-y-auto px-4 py-3 space-y-3 text-sm"></div>

  <div id="chat-attachments" class="px-4 pb-1 flex flex-wrap gap-1"></div>

  <div class="px-4 py-2 border-t border-slate-800 bg-slate-900/60">
    <div id="chat-context-bar" class="text-xs text-slate-500 mono mb-2 flex justify-between">
      <span><span id="chat-tokens">0</span> tokens (~<span id="chat-context-pct">0</span>%)</span>
      <span id="chat-model-limit" class="text-slate-600"></span>
    </div>
    <form id="chat-form" class="space-y-2">
      <textarea id="chat-input"
                rows="3"
                placeholder="Ask about an account, position, trade. Paste a screenshot if helpful."
                class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-sm resize-none focus:border-emerald-500 focus:outline-none"></textarea>
      <div class="flex items-center gap-2">
        <label class="text-xs text-slate-500 hover:text-slate-300 cursor-pointer">
          <input id="chat-file" type="file" accept="image/*" multiple class="hidden">
          attach image
        </label>
        <button id="chat-send"
                type="submit"
                class="ml-auto bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs font-medium">
          send
        </button>
      </div>
    </form>
    <p id="chat-error" class="text-xs text-rose-400 mt-1 hidden"></p>
  </div>
</aside>
