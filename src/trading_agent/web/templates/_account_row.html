<tr id="row-{{ row.id }}">
  <td class="display-text text-base text-ink-100">{{ row.name }}</td>
  <td class="mono text-xs text-ink-40">{{ row.id }}</td>
  <td class="mono text-xs text-ink-80">{{ row.model_display }}</td>
  <td class="num text-ink-80">${{ "%.2f"|format(row.starting_cash) }}</td>
  <td class="text-center">
    <button hx-post="/accounts/{{ row.id }}/toggle"
            hx-target="#row-{{ row.id }}"
            hx-swap="outerHTML"
            class="small-caps {% if row.enabled %}text-vermillion hover:text-vermillion-deep{% else %}text-ink-60 hover:text-ink-100{% endif %}">
      <span class="mark {% if row.enabled %}mark-active{% else %}mark-paused{% endif %}"></span>{{ "active" if row.enabled else "paused" }}
    </button>
  </td>
  <td class="text-right">
    <button hx-delete="/accounts/{{ row.id }}"
            hx-target="#accounts-table"
            hx-swap="outerHTML"
            hx-confirm="Delete account '{{ row.name }}'?"
            class="small-caps text-loss hover:text-loss-soft">
      delete
    </button>
  </td>
</tr>
