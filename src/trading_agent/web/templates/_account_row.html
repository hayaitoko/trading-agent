<tr id="row-{{ row.id }}" class="border-t border-slate-800">
  <td class="py-2 px-4">{{ row.name }}</td>
  <td class="py-2 px-4 mono text-xs text-slate-500">{{ row.id }}</td>
  <td class="py-2 px-4 text-right mono">${{ "%.2f"|format(row.starting_cash) }}</td>
  <td class="py-2 px-4 text-center">
    <button hx-post="/accounts/{{ row.id }}/toggle"
            hx-target="#row-{{ row.id }}"
            hx-swap="outerHTML"
            class="text-xs px-2 py-0.5 rounded {% if row.enabled %}bg-emerald-900/40 text-emerald-300 hover:bg-emerald-900/60{% else %}bg-slate-800 text-slate-500 hover:bg-slate-700{% endif %}">
      {{ "active" if row.enabled else "paused" }}
    </button>
  </td>
  <td class="py-2 px-4 text-right">
    <button hx-delete="/accounts/{{ row.id }}"
            hx-target="#accounts-table"
            hx-swap="outerHTML"
            hx-confirm="Delete account '{{ row.name }}'?"
            class="text-xs text-rose-400 hover:text-rose-300">
      delete
    </button>
  </td>
</tr>
