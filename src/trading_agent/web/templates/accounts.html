{% extends "base.html" %}

{% block content %}
<section class="mb-10 reveal-stack">
  <p class="small-caps text-ink-60 mb-1">register of accounts</p>
  <h1 class="display text-6xl font-black text-ink-100 leading-none">Accounts</h1>
  <p class="mt-4 text-ink-80 max-w-2xl italic">
    Each paper-trading account runs independently against the shared signal feed.
    Bind a different strategy to each to A/B-test ideas.
  </p>
  <hr class="mt-6 heavy">
</section>

<section class="surface p-6 mb-10 reveal-stack">
  <h2 class="small-caps text-ink-60 mb-4">open an account</h2>
  <form hx-post="/accounts/"
        hx-target="#accounts-table"
        hx-swap="outerHTML"
        hx-on::after-request="if (event.detail.successful) this.reset()"
        class="grid grid-cols-1 md:grid-cols-[1fr_auto_auto] gap-5 items-end">
    <div>
      <label class="micro-caps text-ink-60 block mb-1">name</label>
      <input name="name" required
             placeholder="e.g. Paper Momentum"
             class="input-line w-full text-base">
    </div>
    <div>
      <label class="micro-caps text-ink-60 block mb-1">starting cash &nbsp;<span class="text-ink-40">($)</span></label>
      <input name="starting_cash" required type="number" min="1" step="any" value="25000"
             class="input-line w-44 text-base mono tnum text-right">
    </div>
    <button type="submit" class="btn-solid">+ add</button>
  </form>
</section>

{% include "_accounts_table.html" %}
{% endblock %}
