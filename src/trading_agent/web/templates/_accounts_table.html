<div id="accounts-table" class="rounded-lg border border-slate-800 bg-slate-900 overflow-hidden">
  {% if not rows %}
    <p class="p-6 text-center text-slate-500 text-sm">No accounts. Add one above to get started.</p>
  {% else %}
  <table class="w-full text-sm">
    <thead class="bg-slate-950/50 text-slate-500 text-xs uppercase">
      <tr>
        <th class="text-left font-normal py-2 px-4">name</th>
        <th class="text-left font-normal py-2 px-4">id</th>
        <th class="text-right font-normal py-2 px-4">starting cash</th>
        <th class="text-center font-normal py-2 px-4">status</th>
        <th class="text-right font-normal py-2 px-4">actions</th>
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
        {% include "_account_row.html" %}
      {% endfor %}
    </tbody>
  </table>
  {% endif %}
</div>
