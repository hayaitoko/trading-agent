<div id="accounts-table" class="surface overflow-hidden">
  {% if not rows %}
    <p class="px-6 py-12 text-center text-ink-60 italic">
      No accounts on the books. Open one above to get started.
    </p>
  {% else %}
  <table class="ledger">
    <thead>
      <tr>
        <th>Name</th>
        <th>Id</th>
        <th>Model</th>
        <th class="text-right">Starting Cash</th>
        <th class="text-center">Status</th>
        <th class="text-right">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
        {% include "_account_row.html" %}
      {% endfor %}
    </tbody>
  </table>
  {% endif %}
</div>
