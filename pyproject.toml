[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Trading-agent framework: crypto (ccxt) + US equities (Alpaca), autonomous or approval mode."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "hayaitoko" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "ccxt>=4.0.0",
    "alpaca-py>=0.30.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# Everything needed to run the multi-model evaluation bench (web + LLM calls).
bench = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
# WS-D memory: local embedder + vector store. sqlite-vec is the default backend
# (vectors inside SQLite, ships aarch64 wheels for the Pi); qdrant is optional.
# numpy powers the portable cosine fallback when the sqlite-vec extension is absent.
memory = [
    "httpx>=0.27",
    "numpy>=1.26",
    "sqlite-vec>=0.1.6",
    "qdrant-client>=1.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "freezegun>=1.5",
    "httpx>=0.27",
    "numpy>=1.26",
    "sqlite-vec>=0.1.6",
    "qdrant-client>=1.9",
]

[project.scripts]
trading-agent-demo = "trading_agent.scripts.demo:main"
trading-agent-serve = "trading_agent.scripts.serve:main"
trading-agent-bench = "trading_agent.scripts.bench:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trading_agent*"]

[tool.setuptools.package-data]
"trading_agent.web" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/trading_agent"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long lines covered by formatter; B904: noisy on translated exceptions;
# UP007: keep Optional/Union for clarity in public APIs.
ignore = ["E501", "B904", "UP007"]

[tool.ruff.lint.per-file-ignores]
# Tests can use broad except patterns and have imports below `with patch(...)` blocks.
"tests/*" = ["B017", "E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true

# alpaca-py & ccxt return unions like `Position | str` and `Order | str` that
# require excessive isinstance() guards or cast() noise. Trust the SDK at the
# broker boundary.
[[tool.mypy.overrides]]
module = ["trading_agent.alpaca_broker", "trading_agent.ccxt_broker"]
ignore_errors = true
